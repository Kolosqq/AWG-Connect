name: Windows split tunneling

on:
  push:
    branches: [feature/awg-split-tunneling]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      QT_VERSION: 6.10.1
      AMNEZIA_BUILD_TESTS: ON
      QT_FORCE_STDERR_LOGGING: 1
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 10
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          tools: tools_ifw
          dir: ${{ runner.temp }}
          set-env: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Conan
        run: python -m pip install conan==2.28.0
      - name: Build client, service, tests and installer
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
        run: deploy\build.bat --installer ifw
      - name: Run settings and split tunneling regression tests
        shell: cmd
        run: >-
          ctest --test-dir deploy\build\client\tests -C Release
          -R "^(SettingsSignalsTest|UiIpModelAndControllerTest|UiAppSTModelAndControllerTest|UiAllowedDnsModelAndControllerTest|PositiveSplitTunnelTest)$"
          --output-on-failure --no-tests=error --timeout 180
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: deploy/build/client/tests/Testing/Temporary/LastTest.log
          retention-days: 7
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-split-tunneling-installer
          path: deploy/build/AmneziaVPN_*_windows_x64.exe
          if-no-files-found: error
          retention-days: 14
