name: Windows split tunneling

on:
  push:
    branches: [feature/awg-split-tunneling]
    paths-ignore: ['docs/**', '**/*.md', 'deploy/windows/test-folder-wfp.cpp', '.github/workflows/windows-wfp-policy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      QT_VERSION: 6.10.1
      AMNEZIA_BUILD_TESTS: ON
      QT_FORCE_STDERR_LOGGING: 1
      QT_QPA_PLATFORM: offscreen
      AMNEZIA_TEST_IPC_URL: local:amnezia-isolated-regression-tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 10
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Prepare verified public gateway parameters
        run: python deploy/windows/prepare-public-gateway.py
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          tools: tools_ifw
          dir: ${{ runner.temp }}
          set-env: true
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Conan
        run: python -m pip install conan==2.28.0
      - name: Restore native dependencies
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: windows-2022-conan-2.28-release-${{ hashFiles('recipes/**', 'conanfile.py', 'cmake/recipes_bootstrap.cmake') }}
      - name: Configure Release build
        env:
          AWG_UPDATE_SIGNER_SHA256: ${{ vars.AWG_UPDATE_SIGNER_SHA256 }}
        id: configure
        shell: cmd
        run: >-
          cmake -S . -B deploy/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PREFIX_PATH=%QT_ROOT_DIR%" -DAMNEZIA_BUILD_TESTS=ON
          -DCONAN_INSTALL_BUILD_CONFIGURATIONS=Release
          "-DAWG_UPDATE_SIGNER_SHA256=%AWG_UPDATE_SIGNER_SHA256%"
      - name: Cache native dependencies
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Build client, service and regression tests
        id: build
        run: >-
          cmake --build deploy/build --parallel 4 --target
          AmneziaVPN AmneziaVPN-service awg-update-runner test_fork_update test_positive_split_tunnel test_windows_build_readiness
          test_settings_signals test_windows_app_policy test_ui_ip_model_and_controller
          test_ui_app_st_model_and_controller test_ui_allowed_dns_model_and_controller
      - name: Run settings and split tunneling regression tests
        shell: cmd
        run: >-
          ctest --test-dir deploy\build\client\tests -C Release
          -R "^(SettingsSignalsTest|UiIpModelAndControllerTest|UiAppSTModelAndControllerTest|UiAllowedDnsModelAndControllerTest|ForkUpdateTest|PositiveSplitTunnelTest|WindowsBuildReadinessTest)$"
          --output-on-failure --no-tests=error --timeout 180
      - name: Verify app-scoped Kill Switch on isolated runner
        env:
          AMNEZIA_RUN_WFP_TESTS: '1'
        run: ctest --test-dir deploy/build/client/tests -C Release -R '^WindowsAppPolicyTest$' --output-on-failure --no-tests=error --timeout 180
      - name: Stage portable regression tests
        id: portable-tests
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $portable = Join-Path $env:GITHUB_WORKSPACE 'deploy/build/portable-tests'
          cmake --install deploy/build --prefix "$portable" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem deploy/build/client -Filter test_*.exe -Recurse |
            Copy-Item -Destination deploy/build/portable-tests
          Copy-Item "$env:QT_ROOT_DIR/bin/Qt6Test.dll" deploy/build/portable-tests
          Copy-Item "$env:QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" "$portable/plugins/platforms"
      - name: Package installer
        shell: pwsh
        run: |
          $ifw = Get-ChildItem "$env:RUNNER_TEMP/Qt/Tools/QtInstallerFramework" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $ifw) { throw 'Qt Installer Framework was not found' }
          cpack --config deploy/build/CPackConfig.cmake -G IFW -C Release -B deploy/build "-DQTIFWDIR=$($ifw.FullName)"
      - name: Package Windows Installer candidate
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($extension in 'UI','Util') {
            wix extension add -g "WixToolset.${extension}.wixext/4.0.6"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cpack --config deploy/build/CPackConfig.cmake -G WIX -C Release -B deploy/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & deploy/windows/verify-update-msi.ps1 -BuildDirectory deploy/build
      - name: Upload MSI candidate
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-msi
          path: deploy/build/AWG-Connect_*_windows_x64.msi
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: deploy/build/client/tests/Testing/Temporary/LastTest.log
          retention-days: 7
      - name: Upload portable regression tests
        if: always() && steps.portable-tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-regression-tests
          path: deploy/build/portable-tests
          retention-days: 7
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-split-tunneling-installer
          path: deploy/build/AmneziaVPN_*_windows_x64.exe
          if-no-files-found: error
          retention-days: 14
