name: Windows WFP policy check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  folder-policy:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build isolated policy probe
        shell: cmd
        run: cl /nologo /std:c++20 /EHsc /MT /DUNICODE /D_UNICODE deploy\windows\test-folder-wfp.cpp /Fe:wfp-probe.exe /link fwpuclnt.lib ws2_32.lib rpcrt4.lib
      - name: Verify folder filtering on isolated loopback probes
        run: ./wfp-probe.exe
